<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azizcoin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11753903' data-sdk='show_11753903'></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; }
        .balance {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
            color: #4ade80;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:active { background-color: #0284c7; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }
        #status {
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
            color: #94a3b8;
        }
        .min-note {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="titleText"> Azizcoin</h2>
        <p id="subtitleText">Watch ads to earn coins!</p>

        <div class="balance" id="balanceLabel">Coins: <span id="coins">0</span></div>

        <button id="watchBtn" onclick="watchAd()">📺 <span id="watchBtnText">Watch Ad (+5 Coins)</span></button>

        <hr style="border-color: #475569; margin: 20px 0;">

        <h3 id="withdrawTitle">Withdraw TON</h3>
        <p class="min-note" id="minNote">Min: 50,000 coins = 0.5 TON</p>
        <input type="text" id="wallet" placeholder="Tonkeeper address">
        <button onclick="requestWithdraw()" style="background-color: #f59e0b;">💸 <span id="withdrawBtnText">Withdraw</span></button>

        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const initData = tg.initData || '';
        const langCode = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || 'en';
        const lang = langCode.startsWith('ru') ? 'ru' : 'en';

        const translations = {
            en: {
                title: 'Azizcoin',
                subtitle: 'Watch ads to earn coins!',
                watchBtn: 'Watch Ad (+5 Coins)',
                withdrawTitle: 'Withdraw TON',
                minNote: 'Min: 50,000 coins = 0.5 TON',
                walletPlaceholder: 'Tonkeeper address',
                withdrawBtn: 'Withdraw',
                loadingAd: 'Loading ad...',
                adSuccess: '✅ +5 coins added!',
                adFailed: '❌ Ad was not completed',
                errorPrefix: '❌ Error: ',
                unknownError: 'unknown',
                serverError: '❌ Server connection error',
                enterWallet: '⚠️ Enter your Tonkeeper address',
                sending: 'Sending...',
                withdrawSuccess: t => `✅ Request sent: ${t} TON`
            },
            ru: {
                title: ' CoronCoin',
                subtitle: 'Смотри рекламу и зарабатывай монеты!',
                watchBtn: 'Смотреть рекламу (+5 монет)',
                withdrawTitle: 'Вывод TON',
                minNote: 'Мин: 50,000 монет = 0.5 TON',
                walletPlaceholder: 'Адрес Tonkeeper',
                withdrawBtn: 'Вывести',
                loadingAd: 'Загрузка рекламы...',
                adSuccess: '✅ +5 монет добавлено!',
                adFailed: '❌ Реклама не была досмотрена',
                errorPrefix: '❌ Ошибка: ',
                unknownError: 'неизвестна',
                serverError: '❌ Ошибка соединения с сервером',
                enterWallet: '⚠️ Введите адрес Tonkeeper',
                sending: 'Отправка...',
                withdrawSuccess: t => `✅ Запрос отправлен: ${t} TON`
            }
        };

        const t = translations[lang];

        document.getElementById('titleText').innerText = t.title;
        document.getElementById('subtitleText').innerText = t.subtitle;
        document.getElementById('watchBtnText').innerText = t.watchBtn;
        document.getElementById('withdrawTitle').innerText = t.withdrawTitle;
        document.getElementById('minNote').innerText = t.minNote;
        document.getElementById('wallet').placeholder = t.walletPlaceholder;
        document.getElementById('withdrawBtnText').innerText = t.withdrawBtn;

        const coinsEl = document.getElementById('coins');
        const statusEl = document.getElementById('status');
        const watchBtn = document.getElementById('watchBtn');

        async function loadBalance() {
            try {
                const res = await fetch('/api/balance?initData=' + encodeURIComponent(initData));
                const data = await res.json();
                if (data.balance !== undefined) coinsEl.innerText = data.balance;
            } catch (e) { console.error(e); }
        }

        async function creditReward() {
            try {
                const res = await fetch('/api/watch-ad', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData })
                });
                const data = await res.json();
                if (data.balance !== undefined) {
                    coinsEl.innerText = data.balance;
                    statusEl.innerText = t.adSuccess;
                } else {
                    statusEl.innerText = t.errorPrefix + (data.error || t.unknownError);
                }
            } catch (e) {
                statusEl.innerText = t.serverError;
            }
        }

        async function watchAd() {
            watchBtn.disabled = true;
            statusEl.innerText = t.loadingAd;

            if (typeof show_11753903 === 'function') {
                show_11753903().then(() => {
                    // Reklama to'liq ko'rildi — mukofot beramiz
                    creditReward().finally(() => { watchBtn.disabled = false; });
                }).catch(() => {
                    // Reklama ko'rilmadi yoki bekor qilindi — mukofot yo'q
                    statusEl.innerText = t.adFailed;
                    watchBtn.disabled = false;
                });
            } else {
                // SDK yuklanmagan bo'lsa (masalan test rejimida)
                statusEl.innerText = t.serverError;
                watchBtn.disabled = false;
            }
        }

        async function requestWithdraw() {
            const wallet = document.getElementById('wallet').value.trim();
            if (!wallet) {
                statusEl.innerText = t.enterWallet;
                return;
            }

            statusEl.innerText = t.sending;
            try {
                const res = await fetch('/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData, tonAddress: wallet })
                });
                const data = await res.json();
                if (data.ok) {
                    statusEl.innerText = t.withdrawSuccess(data.tonAmount.toFixed(5));
                    loadBalance();
                } else {
                    statusEl.innerText = t.errorPrefix + (data.error || t.unknownError);
                }
            } catch (e) {
                statusEl.innerText = t.serverError;
            }
        }

        loadBalance();
    </script>
</body>
</html>
